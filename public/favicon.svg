<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 28 28" fill="none">
  <!-- currentColor has nothing to inherit from in a standalone favicon, so the
       root carries it and follows the browser's tab theme. -->
  <style>
    svg { color: #0a0a0a; }
    @media (prefers-color-scheme: dark) { svg { color: #f5f5f5; } }
  </style>
  <circle cx="7" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
  <circle cx="7" cy="20" r="3.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
  <line x1="9.5" y1="10" x2="22" y2="13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="9.5" y1="18" x2="22" y2="13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <polygon points="20,11.5 25,13.5 20,15.5" fill="currentColor"/>
</svg>
